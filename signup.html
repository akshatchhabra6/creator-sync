<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | CreatorSync</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-bg-shapes">
    <div class="auth-shape-1"></div>
    <div class="auth-shape-2"></div>
  </div>

  <div class="auth-container animate-fade-in">
    <div class="auth-header">
      <a href="index.html" class="auth-logo">
        <i class="fa-solid fa-bolt"></i>
        <span>CreatorSync</span>
      </a>
      <h2>Create Your Account</h2>
      <p class="text-secondary">Join thousands of creators and brands today.</p>
    </div>

    <div class="glass-panel">
      <div class="role-toggle">
        <button class="role-btn active" id="btn-creator">Creator</button>
        <button class="role-btn" id="btn-brand">Brand</button>
      </div>

      <form action="creator-profile.html" id="signup-form">
        <div class="input-group">
          <label class="input-label" for="fullname" id="name-label">Full Name</label>
          <input type="text" id="fullname" class="input-field" placeholder="John Doe" required>
        </div>

        <div class="input-group">
          <label class="input-label" for="email">Email Address</label>
          <input type="email" id="email" class="input-field" placeholder="you@example.com" required>
        </div>
        
        <div class="input-group">
          <label class="input-label" for="password">Password</label>
          <input type="password" id="password" class="input-field" placeholder="Create a strong password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
          Get Started
        </button>
      </form>
    </div>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    const btnCreator = document.getElementById('btn-creator');
    const btnBrand = document.getElementById('btn-brand');
    const signupForm = document.getElementById('signup-form');
    const nameLabel = document.getElementById('name-label');
    const fullnameInput = document.getElementById('fullname');

    // Simple script to read URL parameters (e.g., from landing page CTA)
    const urlParams = new URLSearchParams(window.location.search);
    const role = urlParams.get('role');
    
    function setRole(selectedRole) {
      if (selectedRole === 'brand') {
        btnBrand.classList.add('active');
        btnCreator.classList.remove('active');
        nameLabel.textContent = 'Company Name';
        fullnameInput.placeholder = 'Acme Corp';
        signupForm.action = 'brand-profile.html';
      } else {
        btnCreator.classList.add('active');
        btnBrand.classList.remove('active');
        nameLabel.textContent = 'Full Name';
        fullnameInput.placeholder = 'John Doe';
        signupForm.action = 'creator-profile.html';
      }
    }

    if (role) {
      setRole(role);
    }

    btnCreator.addEventListener('click', () => setRole('creator'));
    btnBrand.addEventListener('click', () => setRole('brand'));
  </script>
</body>
</html>
